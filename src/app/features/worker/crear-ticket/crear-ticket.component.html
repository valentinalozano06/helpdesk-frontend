<div class="cabecera">
  <a [routerLink]="volverA" class="volver" aria-label="Volver">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  </a>
  <div>
    <h1>Nueva solicitud</h1>
    <p class="meta">Describe el problema para que el equipo pueda atenderlo.</p>
  </div>
</div>

<form class="card formulario" [formGroup]="formulario" (ngSubmit)="enviar()">
  <div class="form-field">
    <label for="asunto">Asunto <span class="requerido">*</span></label>
    <input id="asunto" type="text" formControlName="asunto" placeholder="Ej. No puedo acceder al sistema" />
  </div>

  <div class="form-field">
    <label for="descripcion">Descripción <span class="requerido">*</span></label>
    <textarea id="descripcion" rows="4" formControlName="descripcion" placeholder="Cuéntanos qué ocurre, desde cuándo y qué necesitas revisar..."></textarea>
    <small class="ayuda">Mínimo {{ config.actual().descripcionMinima }} caracteres.</small>
  </div>

  <div class="form-field">
    <label for="categoria">Categoría <span class="requerido">*</span></label>
    <select id="categoria" formControlName="categoriaId">
      <option [ngValue]="null" disabled>Seleccione</option>
      @for (c of categorias(); track c.id) { <option [ngValue]="c.id">{{ c.nombre }}</option> }
    </select>
  </div>

  <div class="form-field">
    <label>Adjuntar evidencia</label>
    <label class="zona-adjunto">
      <input type="file" accept=".png,.jpg,.jpeg,.pdf" (change)="onArchivoSeleccionado($event)" hidden />
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#8b98a5" stroke-width="2"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 20h16"/></svg>
      <span>{{ archivoSeleccionado() ?? 'Haga clic o arrastre un archivo' }}</span>
      <span class="ayuda">PNG, JPG, PDF hasta 10 MB</span>
    </label>
  </div>

  @if (mensajeError()) { <p class="error-text">{{ mensajeError() }}</p> }

  <div class="acciones">
    <a [routerLink]="volverA" class="btn-secondary">Cancelar</a>
    <button type="button" class="btn-secondary" disabled>Guardar borrador</button>
    <button type="submit" class="btn-primary" [disabled]="enviando()">{{ enviando() ? 'Enviando...' : 'Enviar solicitud' }}</button>
  </div>
</form>
